<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FinanzaPersonal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <h1 id="page-title">Inicio</h1>
      <button class="hbtn" id="hide-toggle" aria-label="Ocultar montos">&#128065;</button>
      <button class="hbtn" id="theme-toggle" aria-label="Cambiar tema">&#9789;</button>
    </header>

    <main id="content">
      <section id="page-dashboard" class="page active"></section>
      <section id="page-income" class="page"></section>
      <section id="page-expenses" class="page"></section>
      <section id="page-investments" class="page"></section>
      <section id="page-loans" class="page"></section>
      <section id="page-gold" class="page"></section>
      <section id="page-settings" class="page"></section>
    </main>

    <div id="fab-wrap">
      <button id="fab" aria-label="Agregar">&#43;</button>
    </div>

    <nav id="tabbar">
      <button class="tab" data-page="dashboard"><span class="t-ico">&#127968;</span>Inicio</button>
      <button class="tab" data-page="income"><span class="t-ico">&#8600;</span>Ingresos</button>
      <button class="tab" data-page="expenses"><span class="t-ico">&#8599;</span>Gastos</button>
      <button class="tab" data-page="investments"><span class="t-ico">&#128200;</span>Inversiones</button>
      <button class="tab" data-page="more"><span class="t-ico">&#8226;&#8943;</span>Más</button>
    </nav>

    <div id="sheet-root"></div>
    <div id="toast-container"></div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/gold.js"></script>
  <script src="js/budget.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/income.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/investments.js"></script>
  <script src="js/loans.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
